name: play-internal
on:
  workflow_dispatch:
  push:
    tags:
      - "v*-play"

# Advanced Protection blocks every sideload path, so testers on protected phones can only receive
# updates through Play. This publishes a signed bundle to the internal testing track.
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release secrets
        id: gate
        env:
          SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KEYSTORE: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ] && [ -n "$KEYSTORE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add PLAY_SERVICE_ACCOUNT_JSON and PLAY_KEYSTORE_BASE64 to publish to Play."
          fi
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        if: steps.gate.outputs.ready == 'true'
      - name: Restore keystore
        if: steps.gate.outputs.ready == 'true'
        env:
          KEYSTORE: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed bundle
        if: steps.gate.outputs.ready == 'true'
        working-directory: android
        env:
          BOOKREADER_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          BOOKREADER_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          BOOKREADER_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          BOOKREADER_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
          BOOKREADER_API_BASE_URL: ${{ secrets.BOOKREADER_API_BASE_URL }}
        run: ./gradlew :app:bundleRelease --no-daemon
      - name: Upload to internal testing
        if: steps.gate.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.multilingualbookreader
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      - name: Remove keystore
        if: always() && steps.gate.outputs.ready == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks"
