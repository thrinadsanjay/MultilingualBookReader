# Reverse proxy for the Svara FastAPI container bound to 127.0.0.1:8080.
# CI replaces __SVARA_SERVER_NAME__ with the host from BACKEND_PUBLIC_URL.
# Terminate TLS with certbot: sudo certbot --nginx -d your.domain

server {
    listen 80;
    listen [::]:80;
    server_name __SVARA_SERVER_NAME__;

    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
